name: 🔍 CI

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - "scripts/test-permissions-runtime.sh"
      - "scripts/test-grounds-service-probes.sh"
      - "tests/permissions/**"
      - "tests/grounds-service/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "charts/**"
      - "scripts/test-permissions-runtime.sh"
      - "scripts/test-grounds-service-probes.sh"
      - "tests/permissions/**"
      - "tests/grounds-service/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read
  packages: read

env:
  HELM_VERSION: "3.19.0"

jobs:
  permissions-runtime:
    name: 🧪 Service runtime contracts
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: 📦 Update chart dependencies
        run: |
          helm dependency update charts/grounds-velocity
          helm dependency update charts/grounds-gamemode
          helm dependency update charts/grounds-service

      - name: 🧪 Test permissions runtime contract
        run: bash scripts/test-permissions-runtime.sh

      - name: 🩺 Test grounds-service probe contract
        run: bash scripts/test-grounds-service-probes.sh

  detect-changed-charts:
    name: 🔎 Detect changed charts
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    outputs:
      charts: ${{ steps.matrix.outputs.charts }}
      has-changed-charts: ${{ steps.matrix.outputs.has-changed-charts }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔎 Build chart matrix
        id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          charts=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | awk -F/ '/^charts\/[^/]+\// { print $2 }' \
            | sort -u \
            | jq -Rsc 'split("\n") | map(select(length > 0))')

          echo "charts=$charts" >> "$GITHUB_OUTPUT"
          echo "has-changed-charts=$([[ "$charts" == "[]" ]] && echo false || echo true)" >> "$GITHUB_OUTPUT"

  charts:
    name: 🧪 Lint/Test/Package ${{ matrix.chart }}
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    needs: detect-changed-charts
    if: needs.detect-changed-charts.outputs.has-changed-charts == 'true'
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.detect-changed-charts.outputs.charts) }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔧 Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: 🔧 Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: 🔧 Setup Kubeconform
        run: |
          case "$(uname -m)" in
            x86_64)        ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "Unsupported kubeconform architecture (architecture=$(uname -m))" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-${ARCH}.tar.gz" | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Update chart dependencies
        run: |
          helm dependency update charts/${{ matrix.chart }}

      - name: 🔧 Set template arguments
        id: template-args
        run: |
          if [[ "${{ matrix.chart }}" == "novu" ]]; then
            echo 'args=--set novu.secrets.novuSecretKey=test --set novu.secrets.jwtSecret=test --set novu.secrets.storeEncryptionKey=test --set novu.secrets.awsAccessKeyId=test --set novu.secrets.awsSecretAccessKey=test' >> "$GITHUB_OUTPUT"
          else
            echo 'args=' >> "$GITHUB_OUTPUT"
          fi

      - name: 🔍 Lint chart
        run: |
          helm lint charts/${{ matrix.chart }} ${{ steps.template-args.outputs.args }}

      - name: 🧪 Test chart
        run: |
          helm template test charts/${{ matrix.chart }} ${{ steps.template-args.outputs.args }} | kubeconform -summary -strict -skip IngressRoute,Middleware,Fleet,HTTPRoute,ServiceMonitor

      - name: 📁 Create output directory
        run: mkdir -p .output

      - name: 📦 Package chart
        run: |
          helm package charts/${{ matrix.chart }} --destination .output

      - name: 🔍 Verify packaged files
        run: |
          if ls .output/${{ matrix.chart }}-*.tgz 1> /dev/null 2>&1; then
            echo "✅ Successfully packaged chart:"
            ls -lh .output/${{ matrix.chart }}-*.tgz
          else
            echo "⚠️ No chart was packaged"
            exit 1
          fi
