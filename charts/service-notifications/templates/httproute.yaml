{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "service-notifications.fullname" . }}
  labels:
    {{- include "service-notifications.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "gateway.parentRef.name is required" .Values.gateway.parentRef.name }}
      {{- with .Values.gateway.parentRef.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.gateway.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ required "gateway.hostname is required" .Values.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/notifications
        - path:
            type: PathPrefix
            value: /v1/admin/notifications
        - path:
            type: PathPrefix
            value: /v1/channel/minecraft
        - path:
            type: PathPrefix
            value: /v1/notification-events
      backendRefs:
        - name: {{ include "service-notifications.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
