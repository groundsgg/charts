{{- $permissionsTokenDirectory := dir .Values.permissions.token.mountPath -}}
{{- $sharedTokenDirectory := and .Values.groundsToken.enabled .Values.permissions.enabled (eq .Values.groundsToken.mountPath $permissionsTokenDirectory) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
    grounds/component: velocity
    {{- with .Values.global.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  # Surge first, never below capacity: the new pod must be Ready (see the
  # readinessProbe) before the old one starts draining, or a transferred player
  # has nowhere to land.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- if .Values.drain.enabled }}
  # A draining pod legitimately holds the rollout open until its players are
  # gone; the Deployment default (600s) would flag that as a failed rollout.
  progressDeadlineSeconds: {{ add .Values.terminationGracePeriodSeconds 300 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.podLabels" . | nindent 8 }}
        grounds/component: velocity
        {{- with .Values.global.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.global.commonAnnotations .Values.metrics.enabled }}
      annotations:
        {{- with .Values.global.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "grounds-velocity.metricsAnnotations" . | nindent 8 }}
      {{- end }}
    spec:
      {{- if or .Values.serviceAccount.create .Values.permissions.enabled }}
      serviceAccountName: {{ include "grounds-velocity.serviceAccountName" . }}
      # The baked Agones discovery plugin uses the standard in-cluster client.
      # Keep its API-server token in addition to the scoped projected tokens.
      automountServiceAccountToken: true
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- $imageRepo := .Values.image.repository }}
      {{- if .Values.image.registry }}
      {{- $imageRepo = printf "%s/%s" .Values.image.registry .Values.image.repository }}
      {{- end }}
      {{- with .Values.plugins }}
      initContainers:
        {{- /* The plugins emptyDir is mounted over /app/plugins, hiding the JARs
             baked into the velocity image (plugin-agones-velocity,
             plugin-grounds-runtime, plugin-grounds-platform). Seed the volume
             from the image before the per-plugin fetches so the proxy keeps its
             discovery + platform plugins alongside the fetched ones. */}}
        - name: copy-baked-plugins
          image: "{{ $imageRepo }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - sh
            - -c
            {{/* -r, not -a: the velocity image runs as a non-root user and the
                 emptyDir root is owned by root, so preserving timestamps on the
                 destination directory fails with EPERM and the pod never inits. */}}
            - cp -r /app/plugins/. /plugins/
          volumeMounts:
            - name: plugins
              mountPath: /plugins
        {{- range $plugin := . }}
        - name: fetch-{{ $plugin }}
          image: {{ $.Values.fetcher.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              curl --fail --silent --show-error
              --max-time {{ $.Values.fetcher.timeoutSeconds }}
              --retry 5 --retry-delay 2 --retry-connrefused
              -o /plugins/{{ $plugin }}.jar
              http://{{ $plugin }}:8080/plugin.jar
          volumeMounts:
            - name: plugins
              mountPath: /plugins
        {{- end }}
      {{- end }}
      containers:
        - name: velocity
          image: "{{ $imageRepo }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: minecraft
              containerPort: {{ .Values.ports.minecraft }}
              protocol: TCP
            {{- include "grounds-velocity.metricsPort" . | nindent 12 }}
          env:
            {{- if .Values.metrics.enabled }}
            - name: GROUNDS_METRICS_ENABLED
              value: "true"
            - name: GROUNDS_METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: GROUNDS_METRICS_PATH
              value: {{ .Values.metrics.path | quote }}
            {{- end }}
            - name: VELOCITY_FORWARDING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.forwardingSecret.name }}
                  key: {{ .Values.forwardingSecret.key }}
            {{- with .Values.global.regions }}
            - name: REGIONS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.global.region }}
            # Before .Values.env, not after: duplicate names resolve to the last
            # one, so an explicit entry can still override this.
            - name: REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.global.continent }}
            # The coarse half of the same fact, which the chart already knows and
            # until now only used to build its own mc-router names. plugin-proxy
            # resolves it into the network MOTD as {{"{{localzone}}"}}, so one
            # stored MOTD can name the continent it is being read in.
            - name: CONTINENT
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.drain.enabled }}
            {{- with .Values.drain.transferHost }}
            - name: GROUNDS_DRAIN_TRANSFER_HOST
              value: {{ . | quote }}
            {{- end }}
            - name: GROUNDS_DRAIN_HTTP_PORT
              value: {{ .Values.drain.httpPort | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.groundsToken.enabled }}
            - name: GROUNDS_TOKEN_FILE
              value: {{ printf "%s/token" .Values.groundsToken.mountPath | quote }}
            {{- end }}
            {{- if .Values.permissions.enabled }}
            - name: PERMISSIONS_SERVICE_URL
              value: {{ required "permissions.serviceUrl is required when permissions are enabled" .Values.permissions.serviceUrl | quote }}
            - name: PERMISSIONS_TOKEN_FILE
              value: {{ .Values.permissions.token.mountPath | quote }}
            {{- end }}
            {{- if .Values.floodgateKey.enabled }}
            # start.sh copies this into the plugin's data directory. It is not
            # mounted there directly because Floodgate creates a config.yml in
            # that directory on first start, which a read-only mount prevents.
            - name: FLOODGATE_KEY_FILE
              value: {{ printf "%s/%s" .Values.floodgateKey.mountPath .Values.floodgateKey.key | quote }}
            {{- end }}
          # Readiness gates the rollout: with maxUnavailable 0 the old pod is
          # only terminated once the new one accepts Minecraft connections.
          readinessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- if .Values.drain.enabled }}
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  # Ask the baked plugin-agones to drain, then wait until the
                  # proxy is empty; the kubelet's grace period is the hard stop.
                  # If the endpoint is not there (older image, plugin missing),
                  # the first wget fails and this returns immediately — which is
                  # exactly today's behaviour, not a hang.
                  - |
                    if wget -q -O /dev/null "http://127.0.0.1:{{ .Values.drain.httpPort }}/drain/start?deadlineSeconds={{ max 30 (sub .Values.terminationGracePeriodSeconds 60) }}"; then
                      while [ "$(wget -q -O - "http://127.0.0.1:{{ .Values.drain.httpPort }}/drain/players" 2>/dev/null || echo 0)" != "0" ]; do
                        sleep 5
                      done
                    fi
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- with .Values.plugins }}
            # Only mount the init-container emptyDir over /app/plugins when
            # extra plugins are configured. With none (the default), the mount
            # is omitted and the image's BAKED plugins (plugin-grounds-runtime /
            # plugin-grounds-platform / plugin-agones-velocity) are used as-is.
            # When it IS mounted, copy-baked-plugins seeds it from the image
            # first — otherwise the volume hides the baked JARs and velocity
            # loses routing/discovery (unreachable backends).
            - name: plugins
              mountPath: /app/plugins
            {{- end }}
            {{- if .Values.groundsToken.enabled }}
            - name: grounds-sa-token
              mountPath: {{ .Values.groundsToken.mountPath }}
              readOnly: true
            {{- end }}
            {{- if and .Values.permissions.enabled (not $sharedTokenDirectory) }}
            - name: permissions-sa-token
              mountPath: {{ $permissionsTokenDirectory }}
              readOnly: true
            {{- end }}
            {{- if .Values.floodgateKey.enabled }}
            - name: floodgate-key
              mountPath: {{ .Values.floodgateKey.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.floodgateKey.enabled }}
        - name: floodgate-key
          secret:
            secretName: {{ .Values.floodgateKey.secretName }}
            items:
              - key: {{ .Values.floodgateKey.key }}
                path: {{ .Values.floodgateKey.key }}
        {{- end }}
        {{- with .Values.plugins }}
        - name: plugins
          emptyDir: {}
        {{- end }}
        {{- if .Values.groundsToken.enabled }}
        - name: grounds-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.groundsToken.audience }}
                  expirationSeconds: {{ .Values.groundsToken.expirationSeconds }}
                  path: token
              {{- if $sharedTokenDirectory }}
              - serviceAccountToken:
                  audience: {{ .Values.permissions.token.audience }}
                  expirationSeconds: {{ .Values.permissions.token.expirationSeconds }}
                  path: {{ base .Values.permissions.token.mountPath }}
              {{- end }}
        {{- end }}
        {{- if and .Values.permissions.enabled (not $sharedTokenDirectory) }}
        - name: permissions-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.permissions.token.audience }}
                  expirationSeconds: {{ .Values.permissions.token.expirationSeconds }}
                  path: {{ base .Values.permissions.token.mountPath }}
        {{- end }}
