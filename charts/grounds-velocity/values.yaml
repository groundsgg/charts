# Default values for grounds-velocity.
#
# Per-engineer Velocity proxy. Each plugin in `.plugins[]` corresponds
# to a sibling `plugin-velocity-jar` Helm release in the same namespace
# whose Service serves the JAR over HTTP at /plugin.jar. At pod start
# Velocity runs one init-container per entry to fetch each JAR into the
# emptyDir mounted at /app/plugins.

global:
  commonLabels: {}
  commonAnnotations: {}
  # Which region this cluster is. Rendered as the REGION environment variable
  # when set, and omitted entirely when empty.
  #
  # A `global` value, and a scalar, on purpose: it belongs in a per-cluster
  # values overlay, and Helm merges maps while it *replaces* lists — so putting
  # it in `env` would mean every overlay repeating the whole env list to add one
  # entry, and drifting from it over time.
  region: ""
  # The continent this region belongs to (`eu`, `na`) — the coarse choice a
  # player makes with /region, as opposed to `region` which names a datacentre.
  # Rendered as the CONTINENT environment variable when set, which is where
  # plugin-proxy's `{{localzone}}` MOTD placeholder reads it from.
  continent: ""
  # Which environment this release serves (`stage`). Together with the two
  # domains below it is what lets the chart build its own mc-router names
  # instead of every cluster carrying a hand-written list.
  environment: ""
  # `grounds.gg` — the name players type.
  publicDomain: ""
  # `grnds.io` — the internal zone that carries the geo and per-instance names.
  domain: ""
  # Every region a player can be sent to, `<code>=<host>:<port>` comma
  # separated, rendered as the REGIONS environment variable.
  #
  # Passed by the ApplicationSet from the one file that lists regions, not
  # written here: a catalogue kept in this repo has to be edited in step with
  # that file, and when it drifts /region offers a region that does not exist.
  regions: ""

replicas: 1

image:
  registry: "ghcr.io"
  repository: "groundsgg/velocity"
  tag: "latest"
  pullPolicy: IfNotPresent

# Each entry is the Helm release name of a sibling plugin-velocity-jar
# release. Velocity fetches `http://<name>:8080/plugin.jar` and writes
# it to `/app/plugins/<name>.jar`. Order is preserved.
plugins: []
# Example:
#   plugins:
#     - plugin-social
#     - plugin-chat

# Image used for the per-plugin fetch init-containers.
fetcher:
  image: "curlimages/curl:8.18.0"
  timeoutSeconds: 60

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "2Gi"

# Velocity exposes the player port (modern Minecraft proxy) and an
# optional metrics port via the velocity-prometheus-exporter plugin.
ports:
  # Match the velocity image's baked velocity.toml bind (0.0.0.0:25565). The
  # chart does not template velocity.toml, so the container binds 25565
  # regardless — the Service/probe/targetPort must agree or health + routing fail.
  minecraft: 25565

# Prometheus metrics about the proxy itself — players on it, backends it has
# registered, the network count it reports in the server list, and the JVM under
# them. mc-router measures the front door and the game servers measure their own
# worlds; this is the layer between, which nothing else can see.
#
# Enabling does three things, and all three are needed for a single series to
# arrive: the pod gets the `prometheus.io/*` annotations the satellite's metrics
# agent discovers on, `port` is declared as a containerPort (the agent keeps only
# the target whose port matches the annotation — an undeclared port is silently
# never scraped), and GROUNDS_METRICS_* is set so plugin-proxy binds the
# endpoint.
#
# Needs plugin-proxy 1.1.0 or newer in the image. On an older one the
# annotations point at a closed port and every scrape fails.
metrics:
  enabled: false
  # Must differ from ports.minecraft.
  port: 9000
  path: /metrics

service:
  type: ClusterIP
  externalTrafficPolicy: ""

# velocity-forwarding-secret is provisioned out-of-band (Pulumi/sealed
# secret) so all proxies + game-servers in the namespace share one
# secret. The chart only references it.
forwardingSecret:
  name: "velocity-forwarding-secret"
  key: "secret"

# Graceful proxy drain. When enabled, the pod's preStop hook calls the drain
# endpoint of the baked plugin-agones (loopback only) and waits until the proxy
# is empty: lobby players are moved to another proxy right away with a
# Minecraft transfer packet, players inside a round stay until the round ends,
# and shortly before terminationGracePeriodSeconds runs out the rest is
# transferred regardless. Without this, a rollout kicks everyone.
drain:
  enabled: false
  # Loopback port plugin-agones listens on (GROUNDS_DRAIN_HTTP_PORT).
  httpPort: 8085
  # Optional override for the public host[:port] transferred players reconnect
  # through. Empty on purpose: the plugin then targets this region's own entry
  # in REGIONS (the catalogue /region already transfers with), so one shared
  # values file drains correctly in every region.
  transferHost: ""

# How long a terminating pod may keep running. With drain enabled this is the
# time budget for waiting out rounds — the plugin force-transfers 60s before it
# expires, so pick "longest round + lobby drain + margin".
terminationGracePeriodSeconds: 30

env: []

# ServiceAccount for NATS auth-callout (B4): the broker resolves this pod's
# SA and reads its gg.grounds/events annotation to scope the in-process
# plugins' pub/sub. grounds-forge sets these from the bundle component's
# events: declarations; defaults are inert.
serviceAccount:
  create: false
  name: ""
  annotations: {}
  # Pull secrets attached to the ServiceAccount. Needed whenever the image is
  # not public AND this chart creates its own account: a cluster-wide pull
  # secret normally hangs on the namespace's `default` account, and a pod
  # running as any other account does not inherit it. The failure is an
  # ImagePullBackOff that says nothing about ServiceAccounts.
  imagePullSecrets: []

# Grounds projected SA-token (NATS bearer). When enabled, projects a
# short-lived token (audience grounds-services) and exposes GROUNDS_TOKEN_FILE
# so the plugins present it as the NATS bearer. Inert by default.
groundsToken:
  enabled: false
  audience: grounds-services
  mountPath: /var/run/secrets/grounds
  expirationSeconds: 3600

# Authenticated service-permissions REST access. Forge validates and supplies
# the access declarations; the chart maps only those declarations to exact
# Kubernetes non-resource URL grants.
permissions:
  enabled: false
  serviceUrl: ""
  # Cluster-scoped non-resource URL access for the runtime identity. Disable
  # only when the platform provisions equivalent RBAC for this ServiceAccount.
  rbac:
    create: true
  access: []
  token:
    audience: service-permissions
    expirationSeconds: 3600
    mountPath: /var/run/secrets/grounds/permissions-token
