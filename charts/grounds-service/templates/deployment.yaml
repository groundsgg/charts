{{- if .Values.deployment.enabled }}
{{- if .Values.permissionsToken.enabled }}
{{- if eq (trim .Values.serviceAccount.name) "" }}
{{- fail "permissionsToken requires an explicit serviceAccount.name" }}
{{- end }}
{{- $permissionsMount := trimSuffix "/" .Values.permissionsToken.mountPath }}
{{- $groundsMount := trimSuffix "/" .Values.groundsToken.mountPath }}
{{- $kubernetesMount := "/var/run/secrets/kubernetes.io/serviceaccount" }}
{{- if and .Values.groundsToken.enabled (or (eq $permissionsMount $groundsMount) (hasPrefix (printf "%s/" $permissionsMount) $groundsMount) (hasPrefix (printf "%s/" $groundsMount) $permissionsMount)) }}
{{- fail "projected service-account token mount paths must not overlap" }}
{{- end }}
{{- if and .Values.kubernetesReview.enabled (or (eq $permissionsMount $kubernetesMount) (hasPrefix (printf "%s/" $permissionsMount) $kubernetesMount) (hasPrefix (printf "%s/" $kubernetesMount) $permissionsMount)) }}
{{- fail "projected service-account token mount paths must not overlap" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
    {{- with .Values.global.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.deployment.replicaCount }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.podLabels" . | nindent 8 }}
        {{- with .Values.global.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.global.commonAnnotations .Values.deployment.metrics.enabled }}
      annotations:
        {{- with .Values.global.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.deployment.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.deployment.metrics.port | quote }}
        prometheus.io/path: {{ .Values.deployment.metrics.path | quote }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.deployment.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- if and .Values.deployment.topologySpread.enabled (gt (int .Values.deployment.replicaCount) 1) }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.deployment.topologySpread.topologyKey }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "common.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- if or .Values.serviceAccount.create .Values.kubernetesReview.enabled .Values.permissionsToken.enabled }}
      serviceAccountName: {{ .Values.serviceAccount.name | default .Release.Name }}
      {{- end }}
      {{- if .Values.kubernetesReview.enabled }}
      automountServiceAccountToken: false
      {{- end }}
      {{- $imageRepo := .Values.deployment.image.repository }}
      {{- if .Values.deployment.image.registry }}
      {{- $imageRepo = printf "%s/%s" .Values.deployment.image.registry .Values.deployment.image.repository }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ $imageRepo }}:{{ .Values.deployment.image.tag }}"
          imagePullPolicy: {{ .Values.deployment.image.pullPolicy }}
          {{- if .Values.deployment.containerPort }}
          ports:
            - name: {{ .Values.deployment.containerPortName }}
              containerPort: {{ .Values.deployment.containerPort }}
              protocol: TCP
          {{- end }}
          {{- with .Values.deployment.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if gt (int .Values.deployment.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.deployment.preStopSleepSeconds }}
          {{- end }}
          {{- if or .Values.deployment.env .Values.groundsToken.enabled .Values.permissionsToken.enabled }}
          env:
            {{- with .Values.deployment.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.groundsToken.enabled }}
            - name: GROUNDS_TOKEN_FILE
              value: {{ printf "%s/token" .Values.groundsToken.mountPath | quote }}
            {{- end }}
            {{- if .Values.permissionsToken.enabled }}
            - name: PERMISSIONS_TOKEN_FILE
              value: {{ printf "%s/token" .Values.permissionsToken.mountPath | quote }}
            {{- end }}
          {{- end }}
          {{- if or .Values.groundsToken.enabled .Values.permissionsToken.enabled .Values.kubernetesReview.enabled }}
          volumeMounts:
            {{- if .Values.groundsToken.enabled }}
            - name: grounds-sa-token
              mountPath: {{ .Values.groundsToken.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.permissionsToken.enabled }}
            - name: permissions-sa-token
              mountPath: {{ .Values.permissionsToken.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.kubernetesReview.enabled }}
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.groundsToken.enabled .Values.permissionsToken.enabled .Values.kubernetesReview.enabled }}
      volumes:
        {{- if .Values.groundsToken.enabled }}
        - name: grounds-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.groundsToken.audience }}
                  expirationSeconds: {{ .Values.groundsToken.expirationSeconds }}
                  path: token
        {{- end }}
        {{- if .Values.permissionsToken.enabled }}
        - name: permissions-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: service-permissions
                  expirationSeconds: {{ .Values.permissionsToken.expirationSeconds }}
                  path: token
        {{- end }}
        {{- if .Values.kubernetesReview.enabled }}
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: {{ .Values.kubernetesReview.token.expirationSeconds }}
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        {{- end }}
      {{- end }}
{{- end }}
