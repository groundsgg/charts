# Environment-owned backends for plugin-agones. Proxies reference this
# ConfigMap with env.valueFrom.configMapKeyRef and load the value at startup.
global:
  commonLabels: {}
  commonAnnotations: {}

configMap:
  # This deliberately does not derive from the Helm release name: multiple
  # grounds-velocity releases in one environment need to reference one stable
  # ConfigMap. Bump this explicit version when the static-server set changes,
  # then update each proxy's configMapKeyRef to roll it out.
  name: velocity-static-servers-v1

# Each map key is the Velocity server name and each value is its host:port
# endpoint. Entries are rendered alphabetically by server name.
servers:
  buildserver: buildserver:25565
