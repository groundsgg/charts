{{/*
Who may send to the relay, port by port.

The pod-facing port is the one that matters. A datagram there is trusted to
come from a game server and carries the player's address in its header, so
anything else in the cluster able to reach it could answer in a player's name.
The relay already drops internal datagrams from addresses no route points at;
this keeps everything but game servers from getting that far.

Selecting only the relay's own pods, so nothing else in the namespace becomes
default-deny because of this file.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
    {{- with .Values.global.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Players, from anywhere: the public port is the whole point.
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: UDP
          port: 24454
    # Answers from game servers. Both workload shapes of grounds-gamemode, the
    # Fleet and the Deployment, label their pods with this; the instance label
    # differs per release and would have to list every mode.
    - from:
        - podSelector:
            matchLabels:
              grounds/component: gamemode
      ports:
        - protocol: UDP
          port: 24461
    # /metrics for the region's metrics agent. Kubelet's probes are not listed:
    # they come from the node, which the cluster-wide host policy already
    # admits.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
              app.kubernetes.io/instance: alloy
      ports:
        - protocol: TCP
          port: 8080
