{{- $permissionsTokenDirectory := dir .Values.permissions.token.mountPath -}}
{{- $sharedTokenDirectory := and .Values.groundsToken.enabled .Values.permissions.enabled (eq .Values.groundsToken.mountPath $permissionsTokenDirectory) -}}
{{- if not .Values.agones.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
    grounds/component: gamemode
    grounds/server-type: {{ .Values.kind }}
    {{- with .Values.global.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.podLabels" . | nindent 8 }}
        grounds/component: gamemode
        grounds/server-type: {{ .Values.kind }}
        {{- with .Values.global.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.global.commonAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if eq (include "grounds-gamemode.serviceAccountRequired" .) "true" }}
      serviceAccountName: {{ include "grounds-gamemode.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: {{ include "grounds-gamemode.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: minecraft
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            {{- include "grounds-gamemode.env" . | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.groundsToken.enabled .Values.permissions.enabled }}
          volumeMounts:
            {{- if .Values.groundsToken.enabled }}
            - name: grounds-sa-token
              mountPath: {{ .Values.groundsToken.mountPath }}
              readOnly: true
            {{- end }}
            {{- if and .Values.permissions.enabled (not $sharedTokenDirectory) }}
            - name: permissions-token
              mountPath: {{ $permissionsTokenDirectory }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.groundsToken.enabled .Values.permissions.enabled }}
      volumes:
        {{- if .Values.groundsToken.enabled }}
        - name: grounds-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.groundsToken.audience }}
                  expirationSeconds: {{ .Values.groundsToken.expirationSeconds }}
                  path: token
              {{- if $sharedTokenDirectory }}
              - serviceAccountToken:
                  audience: {{ .Values.permissions.token.audience }}
                  expirationSeconds: {{ .Values.permissions.token.expirationSeconds }}
                  path: {{ base .Values.permissions.token.mountPath }}
              {{- end }}
        {{- end }}
        {{- if and .Values.permissions.enabled (not $sharedTokenDirectory) }}
        - name: permissions-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.permissions.token.audience }}
                  expirationSeconds: {{ .Values.permissions.token.expirationSeconds }}
                  path: {{ base .Values.permissions.token.mountPath }}
        {{- end }}
      {{- end }}
{{- end }}
