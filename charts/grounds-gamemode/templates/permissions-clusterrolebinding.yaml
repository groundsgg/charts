{{- if .Values.permissions.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "grounds-gamemode.permissionsRbacName" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
    gg.grounds/permissions-rbac: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "grounds-gamemode.permissionsRbacName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "grounds-gamemode.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
