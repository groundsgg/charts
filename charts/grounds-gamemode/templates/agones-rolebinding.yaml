{{- if and .Values.agones.enabled (eq (include "grounds-gamemode.serviceAccountRequired" .) "true") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-agones-sdk
  labels:
    {{- include "common.labels" . | nindent 4 }}
    grounds/component: gamemode
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agones-sdk
subjects:
  - kind: ServiceAccount
    name: {{ include "grounds-gamemode.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
