# Default values for grounds-gamemode.
#
# A grounds-gamemode release is one Minecraft game-server kind. The
# chart picks between two backings:
#   - `agones.enabled: true`  → Agones Fleet (autoscaled, dynamic ports)
#   - `agones.enabled: false` → Deployment + Service (fixed port 25565)
#
# Used in the platform-test environment for both:
#   - minestom-lobby      (kind: lobby,    Deployment, single replica)
#   - paper-game          (kind: paper,    Agones Fleet, scales 0..N)
#
# Two independent things, which `kind` alone used to conflate:
#
#   engine — which server binary, and therefore which forwarding env-vars it
#            reads. `minestom` gets GROUNDS_PROXY_MODE +
#            GROUNDS_VELOCITY_FORWARDING_SECRET, `paper` gets
#            PAPER_VELOCITY_SECRET.
#
#   kind   — what role it plays. It becomes the `grounds/server-type` label,
#            which is how Velocity's plugin-agones decides what to discover and
#            which of those are lobbies (its lobby value is literally "lobby").
#
# They were the same field, so a Minestom *game* had no correct value: `game`
# handed it Paper's variable, and `lobby` gave it the right variables but told
# Velocity to send players straight to it.
#
# Leave `engine` empty to keep the old behaviour — it is then inferred as
# minestom for kind=lobby and paper for everything else, which is exactly what
# the single field used to do.
engine: ""

global:
  commonLabels: {}
  commonAnnotations: {}
  # Which region this cluster is. When set, it is appended to the Fleet name and
  # exposed to the game server as the REGION environment variable; when empty
  # both are omitted and the chart behaves exactly as before.
  #
  # A `global` scalar on purpose: it belongs in a per-cluster values overlay,
  # and Helm merges maps while it *replaces* lists — so carrying it in
  # `extraEnv` would force every overlay to repeat the whole list to add one
  # entry.
  region: ""
  # The continent this region belongs to (`eu`, `na`). Exposed as CONTINENT,
  # which is the identity a lobby announces itself with.
  continent: ""
  # The region catalogue ArgoCD passes every component: `<continent>=<host>:<port>`
  # comma separated. Read for this continent's own entry point — it is the only
  # place that carries the node port the proxy is actually published on.
  regions: ""

# Logical kind of the game-server. See note above.
kind: "paper"

image:
  registry: "ghcr.io"
  repository: "groundsgg/paper-game"
  tag: "latest"
  pullPolicy: IfNotPresent

# Agones Fleet mode — set agones.enabled=true to switch from Deployment
# to a Fleet. Bundle.yaml's `helm.agones.fleet` map maps directly here.
#
# Without `autoscaler.enabled`, `minReplicas` is the Fleet's fixed
# `.spec.replicas` and `maxReplicas` does nothing at all — a Fleet of 1 whose
# only server gets allocated leaves the next player with nowhere to go, and
# nothing grows it back.
#
# With it, a Buffer-policy FleetAutoscaler keeps `bufferSize` servers *ready*
# on top of whatever is allocated, between min and max. `minReplicas` then
# becomes the floor rather than the count.
agones:
  enabled: false
  # Matchmaking mode. When on, the matchmaker (service-match) allocates and
  # drives these servers: it selects on the Agones `matches` Counter and pushes
  # each match to the server over NATS. Off for ordinary fleets — a lobby is
  # joined directly, not matchmade — so the counter, the broker address and
  # GROUNDS_MATCHMAKING are all opt-in and a non-matchmade Fleet renders exactly
  # as before.
  matchmaking:
    enabled: false
    # How many matches one server may host at once — the capacity of the
    # `matches` Counter the allocator reads (`minAvailable >= 1`) and increments
    # on allocation. The server decrements it when a match ends.
    counterCapacity: 4
    # Where the server waits for its matches. It subscribes to
    # `match.host.<gameServerName>.start`, and Agones names the pod after the
    # GameServer, so the server derives that name from its own HOSTNAME and the
    # matchmaker never has to know where the pod is.
    #
    # That is the whole reason this replaced a dialled port: these fleets run
    # portPolicy: None, so they have no Service and no DNS name, and the
    # matchmaker had to read the PodIP off the GameServer status.
    natsUrl: "nats://nats.nats.svc.cluster.local:4222"
    # The old MatchHost gRPC port, kept for one release. A runtime that has not
    # migrated yet has no NATS responder, and service-match falls back to this
    # rather than leaving the match unstarted. Remove once every fleet answers
    # on NATS — with it, the container port below.
    grpcPort: 9090
  fleet:
    minReplicas: 0
    maxReplicas: 2
    autoscaler:
      # Off by default: turning this on for every existing release would start
      # changing replica counts on fleets nobody asked to autoscale.
      enabled: false
      # What to keep spare. Meaning depends on the policy the fleet renders:
      #   - non-matchmaking (Buffer): servers kept *ready* beyond those
      #     allocated. An absolute count <= maxReplicas; Agones also requires
      #     minReplicas >= this when minReplicas is non-zero.
      #   - matchmaking (Counter): `matches` slots kept *free* across the fleet.
      #     Must be <= minCapacity (= minReplicas * counterCapacity), so a
      #     matchmade autoscaled fleet needs minReplicas >= 1.
      bufferSize: 2
      # How often Agones re-evaluates. The default 30s is a long time to wait
      # for a lobby when the buffer just emptied.
      syncSeconds: 15

# Deployment-mode config (ignored when agones.enabled).
replicas: 1

# velocity-forwarding-secret is provisioned out-of-band; the chart
# only references it. Same convention as grounds-velocity.
forwardingSecret:
  name: "velocity-forwarding-secret"
  key: "secret"

# Container port. Minecraft default 25565.
containerPort: 25565

# Prometheus metrics about the server itself — tick time, players, instances,
# entities, chunks, and the JVM under them. Agones says whether a server is
# Ready; this says whether the one a player is on is keeping up.
#
# Enabling does three things, and all three are needed for a single series to
# arrive: the pod gets the `prometheus.io/*` annotations the satellite's metrics
# agent discovers on, `port` is declared as a containerPort (the agent keeps only
# the target whose port matches the annotation — an undeclared port is silently
# never scraped), and, on Minestom, GROUNDS_METRICS_* is set so the runtime
# actually binds the endpoint.
#
# Off by default: a scrape target nobody asked for is a metrics bill, and a game
# server is a pod that comes and goes.
#
# `kind: paper` gets the annotations and the port but no env — Paper has no
# endpoint of its own here, so enabling it there means bringing an exporter.
metrics:
  enabled: false
  # Must differ from containerPort.
  port: 9000
  path: /metrics

# Optional entrypoint override. This REPLACES the image's ENTRYPOINT — it does
# not add to it. Every image these charts run is `ENTRYPOINT ["java","-jar",…]`,
# so passing a flag here (`command: ["--port","25565"]`) makes the runtime try
# to exec `--port` as the binary and the container dies before it starts:
#   exec: "--port": executable file not found in $PATH
# Use `args` below for flags; reach for this only to run a different binary.
command: []

# Arguments appended to the image's ENTRYPOINT. This is what flags belong in —
# `args: ["--port","25565"]` reaches the jar as an argument, which is almost
# always the intent.
args: []

# extraEnv merges into env after the kind-specific velocity-secret.
extraEnv: []

resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

service:
  type: ClusterIP

serviceAccount:
  create: false
  name: ""
  annotations: {}
  imagePullSecrets: []

# Grounds projected SA-token (NATS bearer). When enabled, projects a
# short-lived token (audience grounds-services) and exposes GROUNDS_TOKEN_FILE
# so the runtime can present it as the NATS bearer. Inert by default.
groundsToken:
  enabled: false
  audience: grounds-services
  mountPath: /var/run/secrets/grounds
  expirationSeconds: 3600

permissions:
  enabled: false
  serviceUrl: ""
  # Cluster-scoped non-resource URL access for the runtime identity. Disable
  # only when the platform provisions equivalent RBAC for this ServiceAccount.
  rbac:
    create: true
  access: []
  token:
    audience: service-permissions
    expirationSeconds: 3600
    mountPath: /var/run/secrets/grounds/permissions-token
