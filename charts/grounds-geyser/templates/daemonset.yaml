{{/*
A DaemonSet, not a Deployment, and that follows from how a Bedrock client finds
this cluster at all.

A Bedrock client does not read SRV records. It dials UDP 19132 on whatever the
name resolves to, full stop — where a Java client is handed the real port by an
SRV and lands on mc-router's NodePort. 19132 is also outside the NodePort range,
so a Service cannot serve it and the pod has to bind the node directly.

The region's A records carry EVERY worker node's address, because a NodePort
answers on all of them. One Geyser pod on one node would leave a Bedrock player
resolving an address where nothing is listening, with no fallback — so it runs
on every node, and any address in the record set works.

That also removes the reschedule outage the alternative has: a single pod moving
node means waiting out DNS before Bedrock players can reconnect.
*/}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
    {{- with .Values.global.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{/* One node at a time: a Bedrock player on that node reconnects, players on
       the others never notice. RakNet sessions are per-process, so a pod
       replacement always drops the sessions it was holding. */}}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.podLabels" . | nindent 8 }}
        {{- with .Values.global.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{/* Roll the pod when the rendered config changes. Geyser reads
             config.yml once at startup, so without this a values change syncs
             into the ConfigMap and then does nothing until something else
             happens to restart the pod. */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.global.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $imageRepo := .Values.image.repository }}
      {{- if .Values.image.registry }}
      {{- $imageRepo = printf "%s/%s" .Values.image.registry .Values.image.repository }}
      {{- end }}
      containers:
        - name: geyser
          image: "{{ $imageRepo }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{/* No hostPort. It is what a Bedrock client needs — 19132 is outside
               the NodePort range, so a Service cannot serve it the ordinary way
               — but binding it here costs the whole namespace its PodSecurity
               level: baseline forbids hostPort, so allowing one means enforcing
               `privileged` for everything alongside.

               The region's Pulumi stack owns a Service with `externalIPs` set to
               the node addresses instead. Cilium runs with kube-proxy
               replacement and programs those, so UDP 19132 on any node address
               reaches these pods without the pod claiming a port on the host —
               and the namespace stays at baseline. */}}
          ports:
            - name: bedrock
              containerPort: {{ .Values.bedrock.port }}
              protocol: UDP
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{/* /config, not /opt/geyser/config.yml. Geyser does not just read
                 its config, it rewrites it: on startup it fills in every key it
                 has a default for and saves the result back atomically, temp
                 file then rename. Against a read-only mount that rename fails
                 with "Resource busy" and Geyser refuses to start — reported as
                 a config error, which is a long way from the real cause.

                 The image's start.sh copies this into the working directory,
                 which is writable, so the rewrite lands on a copy and is
                 discarded on restart. The ConfigMap stays the only source of
                 truth. Requires geyser image >= 0.1.0. */}}
            - name: config
              mountPath: /config
              readOnly: true
            {{- if .Values.floodgateKey.enabled }}
            - name: floodgate-key
              mountPath: /opt/geyser/floodgate
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}
        {{- if .Values.floodgateKey.enabled }}
        - name: floodgate-key
          secret:
            secretName: {{ .Values.floodgateKey.secretName }}
            items:
              - key: {{ .Values.floodgateKey.key }}
                path: {{ .Values.floodgateKey.key }}
        {{- end }}
